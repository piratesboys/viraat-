<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Meet the members of Viraat Leader Chess Team for GM and discover our chess community."
    >

    <title>
        Our Members | Viraat Leader Chess Team for GM
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <header class="hero">


        <!-- ================================= -->
        <!-- NAVIGATION -->
        <!-- ================================= -->

        <nav>

            <a
                href="index.html"
                class="brand"
            >
                VIRAAT CHESS FOR GM
            </a>


            <div class="links">

                <a href="index.html">
                    Home
                </a>


                <a
                    href="members.html"
                    class="active"
                >
                    Members
                </a>


                <a
                    href="https://lichess.org/team/viraat-leader-chess-team-for-gm"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Lichess Team
                </a>

            </div>

        </nav>


        <!-- ================================= -->
        <!-- HERO CONTENT -->
        <!-- ================================= -->

        <div class="hero-content">

            <p class="eyebrow">
                OUR COMMUNITY
            </p>


            <h1>
                Our <span>Members</span>
            </h1>


            <p>
                Meet the players of Viraat Leader Chess Team for GM
                and discover our chess community.
            </p>


            <div class="buttons">


                <a
                    href="https://lichess.org/team/viraat-leader-chess-team-for-gm"
                    class="btn primary"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Join Our Team
                </a>


                <a
                    href="index.html"
                    class="btn secondary"
                >
                    Back to Home
                </a>


            </div>

        </div>

    </header>


    <!-- ================================= -->
    <!-- MEMBERS -->
    <!-- ================================= -->

    <section class="members-section">


        <h2>
            Team Members
        </h2>


        <!-- ================================= -->
        <!-- MEMBER COUNT -->
        <!-- ================================= -->

        <div class="members-count">

            <span id="member-count">
                Loading...
            </span>


            <span class="count-label">
                members
            </span>

        </div>


        <!-- ================================= -->
        <!-- SEARCH -->
        <!-- ================================= -->

        <div class="member-search">

            <input
                type="search"
                id="member-search"
                placeholder="Search for a member..."
                autocomplete="off"
                aria-label="Search for a member"
            >

        </div>


        <!-- ================================= -->
        <!-- LAST UPDATE -->
        <!-- ================================= -->

        <p
            id="last-update"
            class="last-update"
        >
            Updating...
        </p>


        <!-- ================================= -->
        <!-- MEMBERS LIST -->
        <!-- ================================= -->

        <div id="members">

            <p class="loading">
                Loading team members...
            </p>

        </div>


    </section>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="members.js"></script>


</body>

</html>
